name: Temporary ESLint 10 upgrade runner

on:
  push:
    branches:
      - "tmp/eslint10-upgrade-20261024"

permissions:
  actions: read
  contents: write

concurrency:
  group: temporary-eslint10-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: tmp/eslint10-upgrade-20261024

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm

      - name: Install current locked dependencies
        run: npm ci --no-fund

      - name: Update supported lint-tool declarations
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "package.json";
          const pkg = JSON.parse(readFileSync(path, "utf8"));
          pkg.devDependencies.eslint = "^10.13.0";
          pkg.devDependencies["@eslint/js"] = "^10.0.1";
          pkg.devDependencies["typescript-eslint"] = "^8.56.0";
          writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit

      - name: Install the refreshed lockfile
        run: npm ci --no-fund

      - name: Apply safe ESLint autofixes
        run: npm run lint -- --fix

      - name: Record the upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          content = path.read_text()
          heading = "## Unreleased\n\n"
          entry = "- Upgraded ESLint to supported v10.13.0, aligned `@eslint/js` to v10.0.1, and declared the ESLint-10-compatible `typescript-eslint` range; full validation is recorded after the standard CI run succeeds.\n"
          if entry in content:
              raise SystemExit("The proposed changelog entry already exists.")
          if content.count(heading) != 1:
              raise SystemExit("Expected exactly one Unreleased changelog heading.")
          path.write_text(content.replace(heading, heading + entry + "\n", 1))
          PY

      - name: Format project files
        run: npm run format

      - name: Validate toolchain and Phase 1 checks
        env:
          VITE_BASE_PATH: /game-industry-outreach-tracker/
        run: |
          set +e
          mkdir -p validation
          failed=0

          run_check() {
            name="$1"
            shift
            log="validation/$name.log"
            "$@" > "$log" 2>&1
            status=$?
            printf '%s\n' "$status" > "validation/$name.exit"
            if [ "$status" -eq 0 ]; then
              echo "PASS: $name"
            else
              echo "FAIL: $name (exit $status)"
              failed=1
            fi
          }

          run_check eslint-version npm exec -- eslint --version
          run_check resolved-toolchain npm ls eslint @eslint/js typescript-eslint --depth=0
          run_check format npm run format:check
          run_check lint npm run lint
          run_check typecheck npm run typecheck
          run_check tests npm test
          run_check subpath-build npm run build
          run_check full-audit npm audit
          run_check whitespace git diff --check -- package.json package-lock.json eslint.config.js src tests scripts vite.config.ts

          {
            echo "## ESLint 10 upgrade validation"
            echo
            for item in eslint-version resolved-toolchain format lint typecheck tests subpath-build full-audit whitespace; do
              status="$(cat "validation/$item.exit")"
              if [ "$status" = "0" ]; then result="PASS"; else result="FAIL (exit $status)"; fi
              echo "- **$item:** $result"
            done
            echo
            echo "Candidate changes are committed only if every validation step passes."
          } >> "$GITHUB_STEP_SUMMARY"

          git diff --stat > validation/diff-stat.txt
          git diff -- package.json package-lock.json CHANGELOG.md eslint.config.js src tests scripts vite.config.ts > validation/candidate-diff.patch

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Upload candidate and diagnostics if validation fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: eslint10-upgrade-diagnostics
          path: |
            validation/
            package.json
            package-lock.json
            CHANGELOG.md
            src/
            tests/
            scripts/
            eslint.config.js
            vite.config.ts
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary runner and create candidate commit
        if: success()
        run: |
          set -euo pipefail
          rm .github/workflows/eslint10-upgrade-runner.yml
          rm -rf validation
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: upgrade ESLint to supported v10"
          echo "UPGRADE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "UPGRADE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_STEP_SUMMARY"
          git push origin HEAD:tmp/eslint10-upgrade-20261024
