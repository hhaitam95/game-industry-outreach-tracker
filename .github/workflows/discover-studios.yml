name: Studio discovery pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run offline fixtures, or scan configured official public career sources"
        type: choice
        options:
          - fixture
          - live
        default: fixture
        required: true

# Deliberately no schedule trigger yet. Enable daily polling only after reviewing a successful
# manual live run and confirming that source coverage/error summaries are trustworthy.
permissions:
  contents: read

concurrency:
  group: discovery-state-${{ github.repository }}
  cancel-in-progress: false

jobs:
  fixture-scan:
    name: Offline fixture scan
    if: ${{ inputs.mode != 'live' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run deterministic discovery tests
        run: python3 -m unittest discover -s tests -p 'test_discovery*.py' -v

      - name: Run synthetic registry scan
        run: python3 scripts/discover_studios.py --mode fixture --registry config/studio-registry.json --fixture-dir tests/fixtures/discovery --output-dir outputs/discovery

      - name: Add sanitized scan summary
        if: always()
        run: |
          if [ -f outputs/discovery/scan-report.json ]; then
            echo '## Fixture-only discovery scan' >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('outputs/discovery/scan-report.json').read_text(encoding='utf-8'))
          print(f"Sources processed: **{report['sourceCount']}**")
          print(f"Synthetic fixture roles: **{report['opportunityCount']}**")
          print('\n| Source | Status | Fixture roles | Complete listing evidence |')
          print('|---|---|---:|---|')
          for source in report['sources']:
              print(f"| `{source['source_id']}` | {source['status']} | {source['jobs_found']} | {source['listing_complete']} |")
          print('\nThese roles are synthetic fixtures, not real vacancies.')
          PY
          fi

  live-branch-guard:
    name: Guard live execution to reviewed default branch
    if: ${{ inputs.mode == 'live' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain live-scan guard
        run: |
          echo "Live scanning is restricted to main after the feature branch has been reviewed and merged." >&2
          exit 1

  live-scan:
    name: Live official-source scan
    if: ${{ inputs.mode == 'live' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out reviewed default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the private discovery-state branch read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: discovery-state
          path: .discovery-state
          persist-credentials: false

      - name: Validate discovery tests before contacting sources
        run: python3 -m unittest discover -s tests -p 'test_discovery*.py' -v

      - name: Scan official sources using last-known state
        run: >-
          python3 scripts/discover_studios.py
          --mode live
          --registry config/studio-registry.json
          --state-file .discovery-state/state/discovery/monitor-state.json
          --output-dir outputs/discovery

      - name: Stage state for isolated persistence job
        run: |
          set -euo pipefail
          test -s .discovery-state/state/discovery/monitor-state.json
          mkdir -p state-artifact/state/discovery
          cp .discovery-state/state/discovery/monitor-state.json state-artifact/state/discovery/monitor-state.json

      - name: Upload short-lived private-state handoff artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: discovery-state-handoff
          path: state-artifact/
          if-no-files-found: error
          retention-days: 1

      - name: Upload sanitized scan report and allowlisted public projection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: discovery-scan-report
          path: |
            outputs/discovery/scan-report.json
            outputs/discovery/public-opportunities.json
          if-no-files-found: error
          retention-days: 7

      - name: Add sanitized live scan summary
        if: always()
        run: |
          if [ -f outputs/discovery/scan-report.json ]; then
            echo '## Live official-source discovery scan' >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('outputs/discovery/scan-report.json').read_text(encoding='utf-8'))
          print(f"Sources processed: **{report['sourceCount']}**")
          print(f"Records in private monitor state: **{report['opportunityCount']}**")
          print('\n| Source | Status | Roles found | Complete listing evidence | Error category |')
          print('|---|---|---:|---|---|')
          for source in report['sources']:
              print(f"| `{source['source_id']}` | {source['status']} | {source['jobs_found']} | {source['listing_complete']} | {source.get('error_category') or '—'} |")
          print('\nBlocked or unparseable sources are flagged for review; they are not treated as vacancy closures.')
          print('The public projection is generated for review but is **not published** by this workflow.')
          PY
          fi

  persist-private-state:
    name: Persist validated private monitoring state
    needs: live-scan
    if: ${{ needs.live-scan.result == 'success' && inputs.mode == 'live' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out discovery-state without exposing write credentials to the scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: discovery-state
          path: .discovery-state

      - name: Download private-state handoff artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: discovery-state-handoff
          path: state-artifact

      - name: Validate state contract and persist only the expected file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('state-artifact/state/discovery/monitor-state.json')
          value = json.loads(source.read_text(encoding='utf-8'))
          allowed_root = {'schema_version', 'updated_at', 'sources', 'opportunities', 'events'}
          if set(value) != allowed_root or value.get('schema_version') != 1:
              raise SystemExit('Discovery state failed exact root-key/schema validation.')
          if not isinstance(value.get('sources'), dict) or not isinstance(value.get('opportunities'), dict) or not isinstance(value.get('events'), list):
              raise SystemExit('Discovery state collections have invalid types.')
          source_keys = {'source_id', 'studio_id', 'source_url', 'last_checked_at', 'last_success_at', 'status', 'http_status', 'error_category', 'listing_complete', 'job_ids', 'page_hash'}
          for item in value['sources'].values():
              if set(item) != source_keys:
                  raise SystemExit('A source-state record failed exact-key validation.')
          role_keys = {'id', 'source_id', 'studio_id', 'studio_name', 'title', 'url', 'locations', 'employment_type', 'date_posted', 'valid_through', 'source_url', 'first_seen_at', 'last_seen_at', 'last_changed_at', 'observed_at', 'content_hash', 'status', 'missing_successful_scans'}
          for item in value['opportunities'].values():
              if set(item) != role_keys:
                  raise SystemExit('An opportunity-state record failed exact-key validation.')
          event_keys = {'id', 'source_id', 'entity_id', 'type', 'observed_at', 'summary', 'fields_changed'}
          for item in value['events']:
              if set(item) != event_keys:
                  raise SystemExit('An event record failed exact-key validation.')
          destination = Path('.discovery-state/state/discovery/monitor-state.json')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(value, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('Validated discovery state schema before persistence.')
          PY
          git -C .discovery-state config user.name "github-actions[bot]"
          git -C .discovery-state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .discovery-state add state/discovery/monitor-state.json
          if git -C .discovery-state diff --cached --quiet; then
            echo "No durable monitoring-state changes to commit."
          else
            git -C .discovery-state commit -m "chore: update private discovery monitoring state"
            git -C .discovery-state push origin HEAD:discovery-state
          fi
