name: Studio speculative-route discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-studios.yml"
      - "scripts/discover_speculative_studios.py"
      - "scripts/merge_discovery_datasets.py"
      - "config/manual-studio-exclusions.json"
      - "config/discovery-sources.json"
      - "src/data/speculative-route-directory.json"
      - "src/data/studio-profiles.json"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Bulk backfills the global studio catalogue; hourly keeps looking for new studios and verifies routes."
        type: choice
        options:
          - bulk
          - hourly
        default: bulk
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: studio-discovery-v4-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  discover-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the public website repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check out the separate discovery-state branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: discovery-state
          path: .discovery-state
          persist-credentials: true

      - name: Check Python runtime
        run: |
          python3 --version
          python3 -c "import sys; assert sys.version_info >= (3, 10), 'Python 3.10 or newer is required'"

      - name: Run a resumable discovery batch
        id: discovery
        shell: bash
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          STATE_FILE=".discovery-state/state/studio-discovery-state.json"
          MODE="hourly"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ ! -f "$STATE_FILE" ]; then
            MODE="bulk"
          else
            # Finish the initial GameDevMap catalogue pass first. Later passes
            # restart from the beginning after reaching the end.
            # Once the first pass is complete, hourly discovery continues even if
            # another feed still has retries or manual-review candidates.
            MODE="$(python3 - "$STATE_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              state = json.load(handle)
          map_metrics = state.get("source_stats", {}).get("gamedevmap", {})
          map_complete = (
              state.get("feed_done", {}).get("gamedevmap", False)
              or bool(map_metrics.get("complete"))
              or bool(map_metrics.get("last_pass_completed_at"))
          )
          print("hourly" if map_complete else "bulk")
          PY
          )"
          fi

          SOURCE_PAGE_LIMIT=110
          if [ "$MODE" = "hourly" ]; then
            SOURCE_PAGE_LIMIT=20
          fi

          if [ "$MODE" = "bulk" ]; then
            python3 scripts/discover_speculative_studios.py \
              --mode bulk \
              --batch-size 100 \
              --max-source-pages 110 \
              --max-candidate-checks 1000 \
              --route-check-count 8 \
              --max-run-seconds 1500 \
              --state-file "$STATE_FILE" 2>&1 | tee "$RUNNER_TEMP/game-industry-outreach-tracker-discovery.log"
          else
            # Continue recurring feeds with a bounded hourly budget. The Python
            # scheduler caps each saturated feed independently; unsaturated feeds
            # retain access to the remaining pages. Wikidata requests keep their
            # 65-second spacing and the 25-minute runtime ceiling.
            python3 scripts/discover_speculative_studios.py \
              --mode hourly \
              --batch-size 100 \
              --max-source-pages "$SOURCE_PAGE_LIMIT" \
              --max-candidate-checks 1000 \
              --route-check-count 8 \
              --max-run-seconds 1500 \
              --state-file "$STATE_FILE" 2>&1 | tee "$RUNNER_TEMP/game-industry-outreach-tracker-discovery.log"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "source_page_limit=$SOURCE_PAGE_LIMIT" >> "$GITHUB_OUTPUT"

      - name: Run offline discovery pipeline tests
        run: python3 -m unittest discover -s tests -p 'test_studio_discovery*.py' -v

      - name: Install frontend dependencies
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Run frontend and data tests
        run: |
          npm ci
          npm test
          npm run check:studio-directory
          npm run routes:review

      - name: Build the updated static directory
        run: npm run build
        env:
          VITE_BASE_PATH: /game-industry-outreach-tracker/

      - name: Merge discovery output with the latest published dataset
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Manual PRs may update main while a long discovery batch is running.
          # Rebase the data merge onto the latest main snapshot before publishing.
          max_attempts=3
          initial_main_sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin main
            git reset --mixed origin/main
            python3 scripts/merge_discovery_datasets.py --base-ref origin/main --initial-ref "$initial_main_sha" --candidate-state .discovery-state/state/studio-discovery-state.json

            # These public datasets match the broad local-data ignore rule.
            git add -f -- src/data/speculative-route-directory.json src/data/studio-profiles.json
            if git diff --cached --quiet; then
              echo "data_changed=false" >> "$GITHUB_OUTPUT"
              echo "No public directory changes to publish."
              break
            fi

            git commit -m "data: update verified speculative studio routes"
            if git push origin HEAD:main; then
              echo "data_changed=true" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Could not publish discovery output after $max_attempts attempts."
              exit 1
            fi
            echo "main advanced during publication; retrying the merge on the new main snapshot."
          done

      - name: Validate merged directory before publishing
        run: npm run check:studio-directory

      - name: Rebuild static directory after merging latest main
        if: steps.commit.outputs.data_changed == 'true'
        run: npm run build
        env:
          VITE_BASE_PATH: /game-industry-outreach-tracker/

      - name: Persist discovery cursors and verification state
        shell: bash
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          STATE_FILE=".discovery-state/state/studio-discovery-state.json"
          git -C .discovery-state config user.name "github-actions[bot]"
          git -C .discovery-state config user.email "41898282+hhaitam95@users.noreply.github.com"

          # A deploy or older workflow run may overlap this batch. Never overwrite
          # a newer discovery-state snapshot with a stale local checkout.
          git -C .discovery-state fetch origin discovery-state
          checked_out_sha="$(git -C .discovery-state rev-parse HEAD)"
          remote_sha="$(git -C .discovery-state rev-parse origin/discovery-state)"
          if [ "$checked_out_sha" != "$remote_sha" ]; then
            echo "Discovery state advanced during this run; refusing to overwrite the newer snapshot."
            exit 1
          fi

          # Write a compact, names-free health snapshot for the exhaustion monitor.
          python3 - "$STATE_FILE" config/discovery-sources.json .discovery-state/state/discovery/studio-source-status.json <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import sys

          state_path, manifest_path, output_path = map(pathlib.Path, sys.argv[1:])
          state = json.loads(state_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          candidate_counts = {}
          candidate_reason_counts = {}
          for candidate in state.get("candidates", {}).values():
              source_id = candidate.get("source_id", "unknown")
              statuses = candidate_counts.setdefault(source_id, {})
              status = candidate.get("status", "unknown")
              statuses[status] = statuses.get(status, 0) + 1
              reason = str(candidate.get("reason") or "unspecified")
              reasons = candidate_reason_counts.setdefault(source_id, {})
              reasons[reason] = reasons.get(reason, 0) + 1

          sources = {}
          for source in manifest.get("sources", []):
              source_id = source["id"]
              metrics = state.get("source_stats", {}).get(source_id, {})
              enabled = (
                  source.get("kind") != "igdb_companies"
                  or bool(os.environ.get("IGDB_CLIENT_ID", "").strip()
                          and os.environ.get("IGDB_CLIENT_SECRET", "").strip())
              )
              empty_passes = int(metrics.get("empty_cycles", 0))
              saturated = bool(metrics.get("saturated", False))
              last_candidates = int(metrics.get("last_pass_candidates", 0))
              last_incomplete = int(metrics.get("last_pass_incomplete_candidates", 0))
              no_new_data = bool(
                  enabled
                  and saturated
                  and last_candidates == 0
                  and last_incomplete == 0
                  and metrics.get("last_pass_status") == "saturated"
              )
              sources[source_id] = {
                  "label": source.get("label", source_id),
                  "enabled": enabled,
                  "cycle": int(metrics.get("cycle", 1)),
                  "empty_complete_passes": empty_passes,
                  "saturated": saturated,
                  "last_pass_status": metrics.get("last_pass_status", "not_started"),
                  "last_pass_completed_at": metrics.get("last_pass_completed_at"),
                  "new_candidate_entities_last_pass": last_candidates,
                  "verified_routes_last_pass": int(metrics.get("last_pass_verified", 0)),
                  "incomplete_candidates_last_pass": last_incomplete,
                  "no_new_candidate_data": no_new_data,
                  "current_pass_complete": bool(state.get("feed_done", {}).get(source_id, False)),
                  "candidate_status_counts": candidate_counts.get(source_id, {}),
                  "candidate_reason_counts": candidate_reason_counts.get(source_id, {}),
                  "consecutive_failures": int(metrics.get("consecutive_failures", 0)),
              "last_error": metrics.get("last_error"),
              "last_failure_at": metrics.get("last_failure_at"),
              "last_success_at": metrics.get("last_success_at"),
              "next_retry_at": metrics.get("next_retry_at"),
              }

          enabled_sources = [source for source in sources.values() if source["enabled"]]
          output = {
              "schema_version": 1,
              "updated_at": dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat(),
              "discovery_state_updated_at": state.get("updated_at"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_number": os.environ.get("GITHUB_RUN_NUMBER"),
              "workflow_commit": os.environ.get("GITHUB_SHA"),
              "igdb_enabled": bool(os.environ.get("IGDB_CLIENT_ID", "").strip()
                                   and os.environ.get("IGDB_CLIENT_SECRET", "").strip()),
              "source_count": len(sources),
              "enabled_source_count": len(enabled_sources),
              "all_enabled_sources_no_new_candidate_data": bool(enabled_sources)
                  and all(source["no_new_candidate_data"] for source in enabled_sources),
              "candidate_pool_size": len(state.get("candidates", {})),
              "identity_review_queue_count": len(state.get("identity_review_queue", [])),
              "candidate_status_counts": {
                  status: sum(counts.get(status, 0) for counts in candidate_counts.values())
                  for status in ("queued", "retry", "needs_review", "no_route", "published", "duplicate", "excluded")
              },
              "sources": sources,
          }
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
          PY

          git -C .discovery-state add state/studio-discovery-state.json state/discovery/studio-source-status.json
          if git -C .discovery-state diff --cached --quiet; then
            echo "No discovery-state changes to persist."
          else
            git -C .discovery-state commit -m "chore: advance speculative studio discovery state"
            git -C .discovery-state push origin HEAD:discovery-state
          fi

      - name: Upload Pages artifact when the public dataset changed
        if: steps.commit.outputs.data_changed == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Deploy updated directory
        id: deployment
        if: steps.commit.outputs.data_changed == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Add sanitized workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Game Industry Outreach Tracker discovery run"
            echo "- Mode: ${{ steps.discovery.outputs.mode || 'not started' }}"
            echo "- Source-page cap: ${{ steps.discovery.outputs.source_page_limit || 'not set' }}"
            echo "- Public changes: ${{ steps.commit.outputs.data_changed || 'not committed' }}"
            if [ -f "$RUNNER_TEMP/game-industry-outreach-tracker-discovery.log" ]; then
              for key in igdb_enabled source_pages source_candidates candidate_checks verified_added routes_checked time_budget_exhausted source_failures; do
                value="$(awk -F': ' -v key="$key" '$1 == key { print substr($0, index($0, ": ") + 2); exit }' "$RUNNER_TEMP/game-industry-outreach-tracker-discovery.log")"
                if [ -n "$value" ]; then
                  label="$(printf '%s' "$key" | tr '_' ' ')"
                  echo "- ${label^}: $value"
                fi
              done
            fi
            STATE_FILE=".discovery-state/state/studio-discovery-state.json"
            if [ -f "$STATE_FILE" ]; then
              python3 - "$STATE_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              state = json.load(handle)
          candidates = state.get("candidates", {})
          counts = {}
          for candidate in candidates.values():
              status = candidate.get("status", "unknown")
              counts[status] = counts.get(status, 0) + 1

          print(f"- Saved checkpoint: {state.get('updated_at', 'unknown')}")
          print(f"- Candidate pool: {len(candidates):,}")
          print(f"- Identity collisions awaiting review: {len(state.get('identity_review_queue', [])):,}")
          for status in ("queued", "retry", "needs_review", "no_route", "published", "duplicate", "excluded"):
              print(f"- {status.replace('_', ' ').title()}: {counts.get(status, 0):,}")
          print(f"- Aggregate saturated (telemetry only): {'yes' if state.get('saturated') else 'no'}")
          with open("config/discovery-sources.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          source_stats = state.get("source_stats", {})
          for source in manifest.get("sources", []):
              source_id = source["id"]
              metrics = source_stats.get(source_id, {})
              done = state.get("feed_done", {}).get(source_id, False)
              cursor = state.get("feed_cursors", {}).get(source_id, "")
              print(
                  f"- {source['label']}: pass={metrics.get('last_pass_status', 'unknown')}; "
                  f"cycle={metrics.get('cycle', 1)}; empty passes={metrics.get('empty_cycles', 0)}; "
                  f"saturated={'yes' if metrics.get('saturated') else 'no'}; "
                  f"current pass={'at end' if done else 'in progress'}; cursor={cursor or 'start'}"
              )
          PY
            else
              echo "- Saved discovery checkpoint: unavailable"
            fi
            echo "- Discovery checkpoint: the discovery-state branch is publicly visible and contains public-source employer leads plus operational metadata only."
            echo "- Do not store candidate personal data, CVs, application history, secrets or private profile information in discovery state."
            echo "- Unavailable, blocked, robots-disallowed or ambiguous pages do not close routes."
          } >> "$GITHUB_STEP_SUMMARY"
