name: Studio speculative-route discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-studios.yml"
      - "scripts/discover_speculative_studios.py"
      - "scripts/merge_discovery_datasets.py"
      - "config/manual-studio-exclusions.json"
      - "src/data/speculative-route-directory.json"
      - "src/data/studio-profiles.json"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Bulk backfills the global studio catalogue; hourly keeps looking for new studios and verifies routes."
        type: choice
        options:
          - bulk
          - hourly
        default: bulk
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: studio-discovery-v4-${{ github.repository }}
  cancel-in-progress: false

jobs:
  discover-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the public website repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Check out the separate discovery-state branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: discovery-state
          path: .discovery-state
          persist-credentials: true

      - name: Check Python runtime
        run: |
          python3 --version
          python3 -c "import sys; assert sys.version_info >= (3, 10), 'Python 3.10 or newer is required'"

      - name: Run a resumable discovery batch
        id: discovery
        shell: bash
        run: |
          set -euo pipefail
          STATE_FILE=".discovery-state/state/studio-discovery-state.json"
          MODE="hourly"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ ! -f "$STATE_FILE" ]; then
            MODE="bulk"
          else
            # Keep using the larger batch while the initial GameDevMap catalogue
            # is still downloading or any candidates remain due for verification.
            MODE="$(python3 - "$STATE_FILE" <<'PY'
          import datetime as dt
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              state = json.load(handle)
          today = dt.date.today().isoformat()
          candidates = state.get("candidates", {}).values()
          pending = any(
              item.get("status") == "queued"
              or (
                  item.get("status") == "retry"
                  and (not item.get("next_check_at") or item["next_check_at"] <= today)
              )
              for item in candidates
          )
          map_complete = state.get("feed_done", {}).get("gamedevmap", False)
          print("hourly" if map_complete and not pending else "bulk")
          PY
          )"
          fi

          SOURCE_PAGE_LIMIT=110
          if [ "$MODE" = "hourly" ]; then
            SOURCE_PAGE_LIMIT=8
          fi
          if [ "$MODE" = "hourly" ] && [ -f "$STATE_FILE" ]; then
            SATURATED="$(python3 - "$STATE_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              state = json.load(handle)
          print("true" if state.get("saturated") else "false")
          PY
          )"
            if [ "$SATURATED" = "true" ]; then
              # Once three complete cycles add no verified routes, keep checking
              # the source feeds, but reduce refresh pressure from 8 pages/hour
              # to 1 page/hour. A verified addition clears saturation.
              SOURCE_PAGE_LIMIT=1
            fi
          fi

          if [ "$MODE" = "bulk" ]; then
            python3 scripts/discover_speculative_studios.py \
              --mode bulk \
              --batch-size 100 \
              --max-source-pages 110 \
              --max-candidate-checks 1000 \
              --route-check-count 8 \
              --max-run-seconds 1500 \
              --state-file "$STATE_FILE" 2>&1 | tee "$RUNNER_TEMP/game-industry-outreach-tracker-discovery.log"
          else
            # Continue unfinished Wikidata feeds with a bounded hourly budget.
            # Normal exploration checks up to 8 pages; saturated maintenance
            # checks 1 page. The scraper preserves the 65-second Wikidata
            # request spacing and the 25-minute runtime ceiling in both modes.
            python3 scripts/discover_speculative_studios.py \
              --mode hourly \
              --batch-size 100 \
              --max-source-pages "$SOURCE_PAGE_LIMIT" \
              --max-candidate-checks 1000 \
              --route-check-count 8 \
              --max-run-seconds 1500 \
              --state-file "$STATE_FILE" 2>&1 | tee "$RUNNER_TEMP/game-industry-outreach-tracker-discovery.log"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "source_page_limit=$SOURCE_PAGE_LIMIT" >> "$GITHUB_OUTPUT"

      - name: Run offline discovery pipeline tests
        run: python3 -m unittest discover -s tests -p 'test_studio_discovery*.py' -v

      - name: Install frontend dependencies
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Run frontend and data tests
        run: |
          npm ci
          npm test
          npm run check:studio-directory
          npm run routes:review

      - name: Build the updated static directory
        run: npm run build
        env:
          VITE_BASE_PATH: /game-industry-outreach-tracker/

      - name: Merge discovery output with the latest published dataset
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Manual PRs may update main while a long discovery batch is running.
          # Rebase the data merge onto the latest main snapshot before publishing.
          max_attempts=3
          initial_main_sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin main
            git reset --mixed origin/main
            python3 scripts/merge_discovery_datasets.py --base-ref origin/main --initial-ref "$initial_main_sha" --candidate-state .discovery-state/state/studio-discovery-state.json

            # These public datasets match the broad local-data ignore rule.
            git add -f -- src/data/speculative-route-directory.json src/data/studio-profiles.json
            if git diff --cached --quiet; then
              echo "data_changed=false" >> "$GITHUB_OUTPUT"
              echo "No public directory changes to publish."
              break
            fi

            git commit -m "data: update verified speculative studio routes"
            if git push origin HEAD:main; then
              echo "data_changed=true" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Could not publish discovery output after $max_attempts attempts."
              exit 1
            fi
            echo "main advanced during publication; retrying the merge on the new main snapshot."
          done

      - name: Rebuild static directory after merging latest main
        if: steps.commit.outputs.data_changed == 'true'
        run: npm run build
        env:
          VITE_BASE_PATH: /game-industry-outreach-tracker/

      - name: Persist discovery cursors and verification state
        shell: bash
        run: |
          set -euo pipefail
          git -C .discovery-state config user.name "github-actions[bot]"
          git -C .discovery-state config user.email "41898282+hhaitam95@users.noreply.github.com"

          # A deploy or older workflow run may overlap this batch. Never overwrite
          # a newer discovery-state snapshot with a stale local checkout.
          git -C .discovery-state fetch origin discovery-state
          checked_out_sha="$(git -C .discovery-state rev-parse HEAD)"
          remote_sha="$(git -C .discovery-state rev-parse origin/discovery-state)"
          if [ "$checked_out_sha" != "$remote_sha" ]; then
            echo "Discovery state advanced during this run; refusing to overwrite the newer snapshot."
            exit 1
          fi

          git -C .discovery-state add state/studio-discovery-state.json
          if git -C .discovery-state diff --cached --quiet; then
            echo "No discovery-state changes to persist."
          else
            git -C .discovery-state commit -m "chore: advance speculative studio discovery state"
            git -C .discovery-state push origin HEAD:discovery-state
          fi

      - name: Upload Pages artifact when the public dataset changed
        if: steps.commit.outputs.data_changed == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Deploy updated directory
        id: deployment
        if: steps.commit.outputs.data_changed == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Add sanitized workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Game Industry Outreach Tracker discovery run"
            echo "- Mode: ${{ steps.discovery.outputs.mode || 'not started' }}"
            echo "- Source-page cap: ${{ steps.discovery.outputs.source_page_limit || 'not set' }}"
            echo "- Public changes: ${{ steps.commit.outputs.data_changed || 'not committed' }}"
            if [ -f "$RUNNER_TEMP/game-industry-outreach-tracker-discovery.log" ]; then
              for key in source_pages source_candidates candidate_checks verified_added routes_checked time_budget_exhausted; do
                value="$(awk -F': ' -v key="$key" '$1 == key { print substr($0, index($0, ": ") + 2); exit }' "$RUNNER_TEMP/game-industry-outreach-tracker-discovery.log")"
                if [ -n "$value" ]; then
                  label="$(printf '%s' "$key" | tr '_' ' ')"
                  echo "- ${label^}: $value"
                fi
              done
            fi
            STATE_FILE=".discovery-state/state/studio-discovery-state.json"
            if [ -f "$STATE_FILE" ]; then
              python3 - "$STATE_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              state = json.load(handle)
          candidates = state.get("candidates", {})
          counts = {}
          for candidate in candidates.values():
              status = candidate.get("status", "unknown")
              counts[status] = counts.get(status, 0) + 1

          print(f"- Saved checkpoint: {state.get('updated_at', 'unknown')}")
          print(f"- Candidate pool: {len(candidates):,}")
          for status in ("queued", "retry", "needs_review", "no_route", "published", "duplicate", "excluded"):
              print(f"- {status.replace('_', ' ').title()}: {counts.get(status, 0):,}")
          print(f"- Discovery cycle: {state.get('cycle', 1)}")
          print(f"- Consecutive empty cycles: {state.get('empty_cycles', 0)}")
          print(f"- Saturated maintenance: {'yes' if state.get('saturated') else 'no'}")
          for feed_id in ("wikidata_video_game_developers", "wikidata_game_developer_credits", "wikidata_video_game_companies", "gamedevmap"):
              done = state.get("feed_done", {}).get(feed_id, False)
              cursor = state.get("feed_cursors", {}).get(feed_id, "")
              label = feed_id.replace("_", " ").title()
              print(f"- {label}: {'complete' if done else 'in progress'} (cursor: {cursor or 'start'})")
          PY
            else
              echo "- Saved discovery checkpoint: unavailable"
            fi
            echo "- Candidate names and route evidence remain in the private discovery-state branch."
            echo "- Unavailable, blocked, robots-disallowed or ambiguous pages do not close routes."
          } >> "$GITHUB_STEP_SUMMARY"
