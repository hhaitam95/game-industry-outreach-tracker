name: Temporary Phase 3 formatter diagnostics

on:
  push:
    branches:
      - feat/phase3-manual-studio-catalog

permissions:
  contents: read

jobs:
  format-diagnostic:
    name: Print Prettier's exact formatting diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format copies in the ephemeral runner and show the exact patch
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write src/components/StudioCatalog.tsx src/lib/studios/catalog.mjs
          git --no-pager diff -- src/components/StudioCatalog.tsx src/lib/studios/catalog.mjs
