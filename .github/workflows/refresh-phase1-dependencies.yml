name: Refresh Phase 1 dependency lock (temporary)

on:
  push:
    branches:
      - feat/static-frontend-shell

permissions:
  contents: read

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[phase1-refresh]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install baseline lockfile
        run: npm ci --no-fund

      - name: Update packages within declared semver ranges
        continue-on-error: true
        run: npm update --package-lock-only --ignore-scripts --no-fund

      - name: Apply non-breaking security fixes to lockfile
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Capture full audit report
        if: always()
        run: npm audit --json > npm-audit.json || true

      - name: Reinstall refreshed lockfile
        continue-on-error: true
        run: npm ci --no-fund

      - name: Format files covered by the project formatter
        continue-on-error: true
        run: npm run format

      - name: Run basic checks for diagnostics
        if: always()
        continue-on-error: true
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high

      - name: Upload temporary lockfile and audit artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase1-lock-refresh
          path: |
            package-lock.json
            npm-audit.json
            src/App.tsx
            tests/navigation.test.mjs
            scripts/feedback-report.mjs
            scripts/report-safety.mjs
            vite.config.ts
          if-no-files-found: error
          retention-days: 1
