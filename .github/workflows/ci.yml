name: Build website

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: python3 -m unittest discover -s tests -p 'test_studio_discovery*.py' -v
      - run: npm ci
      - run: npm test
      - run: npm run check:studio-directory
      - run: npm run routes:review
      - run: npm run build
        env:
          VITE_BASE_PATH: /game-industry-outreach-tracker/
